# ─── SafeSense AI — Production Deployment Baseline (Phase 7) ─────────────────
# Usage:
#   docker compose -f docker-compose.prod.yml up --build -d
#
# Prerequisite: Configure production secrets in backend/.env or your deployment environment.
# Never commit real credentials to version control.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: safesense-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-safesense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided}
      POSTGRES_DB: ${POSTGRES_DB:-safesense}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - pgbackup_prod:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-safesense} -d $${POSTGRES_DB:-safesense}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - safesense-prod-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: safesense-backend-prod
    restart: unless-stopped
    environment:
      SAFESENSE_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-safesense}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-safesense}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be provided (>= 32 chars)}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ALLOW_DEMO_AUTH: ${ALLOW_DEMO_AUTH:-false}
      ALLOW_ADMIN_RESET: ${ALLOW_ADMIN_RESET:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      SAFESENSE_EMBEDDING_PROVIDER: ${SAFESENSE_EMBEDDING_PROVIDER:-none}
      WORKERS: ${BACKEND_WORKERS:-2}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - safesense-prod-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: safesense-frontend-prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - safesense-prod-net

networks:
  safesense-prod-net:
    driver: bridge

volumes:
  pgdata_prod:
  pgbackup_prod:
